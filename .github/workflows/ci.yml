name: BAGSOLAR CI

on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ cmake pkg-config git \
            libasound2-dev libgl1-mesa-dev libxcursor-dev libxinerama-dev \
            libxrandr-dev libxi-dev libx11-dev libwayland-dev libxkbcommon-dev
          git clone --depth 1 --branch 5.5 https://github.com/raysan5/raylib.git /tmp/raylib
          cmake -S /tmp/raylib -B /tmp/raylib/build \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_EXAMPLES=OFF -DBUILD_GAMES=OFF
          cmake --build /tmp/raylib/build --parallel 2
          sudo cmake --install /tmp/raylib/build
      - name: Configure
        run: cmake --preset debug
      - name: Build
        run: cmake --build --preset debug --parallel 2
      - name: Test
        run: ctest --preset debug --output-on-failure
      - name: Scientific validation
        run: ./build/bagsolar_validation
      - name: Education validation
        run: ./build/bagsolar_education_tests
      - name: Offline local ephemeris validation
        run: ./build/bagsolar_ephemeris --local earth 2451545.0 heliocentric
      - name: Install smoke
        run: ctest --test-dir build -R '^bagsolar_install_smoke$' --output-on-failure
      - name: Package
        run: cmake --build build --target package
      - name: Package smoke
        run: ctest --test-dir build -R '^bagsolar_package_smoke$' --output-on-failure
