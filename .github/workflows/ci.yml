name: BAGS_LAB CI/CD

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bags-lab-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            runner: ubuntu-latest
            artifact: BAGS_LAB-linux-x64
            bundle_raylib: "OFF"
            portable: "OFF"
          - name: Windows x64
            runner: windows-latest
            artifact: BAGS_LAB-windows-x64
            bundle_raylib: "ON"
            portable: "ON"
          - name: macOS
            runner: macos-latest
            artifact: BAGS_LAB-macos
            bundle_raylib: "ON"
            portable: "ON"

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ cmake pkg-config git \
            libasound2-dev libgl1-mesa-dev libxcursor-dev libxinerama-dev \
            libxrandr-dev libxi-dev libx11-dev libwayland-dev libxkbcommon-dev
          git clone --depth 1 --branch 5.5 https://github.com/raysan5/raylib.git /tmp/raylib
          cmake -S /tmp/raylib -B /tmp/raylib/build \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_EXAMPLES=OFF -DBUILD_GAMES=OFF \
            -DGLFW_BUILD_X11=OFF -DGLFW_BUILD_WAYLAND=ON
          cmake --build /tmp/raylib/build --parallel 2
          sudo cmake --install /tmp/raylib/build
          sudo ldconfig
          echo "PKG_CONFIG_PATH=/usr/local/lib/pkgconfig:/usr/local/lib/x86_64-linux-gnu/pkgconfig:${PKG_CONFIG_PATH}" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=/usr/local/lib:/usr/local/lib/x86_64-linux-gnu:${LD_LIBRARY_PATH}" >> "$GITHUB_ENV"

      - name: Configure
        shell: bash
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=${{ runner.os == 'Linux' && 'ON' || 'OFF' }} \
            -DBAGS_LAB_BUNDLE_RAYLIB=${{ matrix.bundle_raylib }} \
            -DBAGS_LAB_PORTABLE=${{ matrix.portable }} \
            -DBAGS_LAB_INSTALL_PLANET_MODELS=ON

      - name: Build
        shell: bash
        run: cmake --build build --config Release --parallel 2

      - name: Test and validate Linux build
        if: runner.os == 'Linux'
        shell: bash
        run: |
          ctest --test-dir build --output-on-failure
          ./build/bagsolar_validation
          ./build/bagsolar_education_tests
          ./build/bagsolar_ephemeris --local earth 2451545.0 heliocentric

      - name: Create package
        shell: bash
        run: cmake --build build --config Release --target package

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            build/*.tar.gz
            build/*.tgz
            build/*.zip
          if-no-files-found: error
          retention-days: 14
